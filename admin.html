<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin RSVP — Azfar & Azraf</title>
<style>
:root{--navy:#06162d;--gold:#d4af37;--paper:#f3f1eb;--muted:#718096;--line:#e4e7eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#17283d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 50px}header{background:linear-gradient(145deg,#0d2c51,#041326);color:#fff;border-radius:24px;padding:25px;margin-bottom:18px}h1{margin:0 0 5px;font-family:Georgia,serif;font-weight:600}header p{margin:0;color:#cbd6e2;font-size:13px}.login,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 35px rgba(6,22,45,.06)}.login{max-width:520px;margin:35px auto}.field{display:grid;gap:7px;margin-bottom:13px}label{font-size:12px;font-weight:800}input{width:100%;padding:12px 13px;border:1px solid #d8dee5;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#07162b;font-weight:800;cursor:pointer}button.secondary{background:var(--navy);color:#fff}.msg{font-size:12px;color:#b42318;margin-top:10px;min-height:18px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0;font-family:Georgia,serif}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:flex-start;flex-direction:column}.toolbar button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>RSVP Admin</h1><p>Tasyakuran Khitan — Azfar &amp; Azraf</p></header>
<section id="login" class="login"><div class="field"><label>Admin Token</label><input id="token" type="password" autocomplete="current-password" placeholder="Masukkan token admin"></div><button id="loginBtn">Masuk</button><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden">
<div class="stats"><div class="stat"><b id="hadir">0</b><span>Hadir (RSVP)</span></div><div class="stat"><b id="tidakHadir">0</b><span>Tidak Hadir</span></div><div class="stat"><b id="totalTamu">0</b><span>Total Tamu</span></div><div class="stat"><b id="totalRsvp">0</b><span>Total RSVP</span></div></div>
<div class="panel"><div class="toolbar"><h2>Daftar Tamu</h2><button id="csvBtn" class="secondary">Download CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Kehadiran</th><th>Tamu</th><th>Ucapan &amp; Do'a</th><th>Tanda Kasih</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</section>
</div>
<script>
let token='';let entries=[];
const $=id=>document.getElementById(id);
$('loginBtn').onclick=async()=>{token=$('token').value.trim();if(!token){$('loginMsg').textContent='Token wajib diisi.';return}await load()};
$('token').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
async function load(){
  $('loginMsg').textContent='Memuat...';
  try{const r=await fetch('/api/admin',{headers:{Authorization:`Bearer ${token}`}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Akses ditolak');
    entries=data.entries||[];$('hadir').textContent=data.summary.hadir;$('tidakHadir').textContent=data.summary.tidak_hadir;$('totalTamu').textContent=data.summary.total_tamu;$('totalRsvp').textContent=data.summary.total_rsvp;render();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');
  }catch(e){$('loginMsg').textContent=e.message}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){$('rows').innerHTML=entries.length?entries.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.attendance)}</td><td>${esc(x.guest_count)}</td><td>${esc(x.message)}</td><td>${esc(x.gift_type||'—')}</td><td>${esc(x.created_at)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada data.</td></tr>'}
$('csvBtn').onclick=()=>{const head=['Nama','Kehadiran','Jumlah Tamu','Ucapan & Do\'a','Tanda Kasih','Waktu'];const lines=[head,...entries.map(x=>[x.name,x.attendance,x.guest_count,x.message,x.gift_type||'',x.created_at])].map(row=>row.map(csv).join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rsvp-azfar-azraf.csv';a.click();URL.revokeObjectURL(a.href)};
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
</script>
</body>
</html>
